<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Una canción para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="corazones" id="corazones" aria-hidden="true"></div>

  <main class="pagina">

    <!-- Lo que ella ve -->
    <header class="dedicatoria">
      <h1 id="titulo">Esta canción es para ti</h1>
      <p class="para" id="textoPara"></p>
      <p class="mensaje" id="textoMensaje"></p>
      <p class="firma" id="textoDe"></p>
    </header>

    <section class="canciones" id="zonaCanciones">
      <div id="listaSpotify"></div>
      <div id="listaLocal"></div>
      <p class="vacio" id="textoVacio">Aquí aparecerán las canciones que elijas.</p>
    </section>

    <!-- Lo que ves tú (se oculta en la vista previa) -->
    <section class="editor" id="panelEditor">
      <h2>Arma tu dedicatoria</h2>

      <label for="campoPara">Para quién es</label>
      <input type="text" id="campoPara" placeholder="Su nombre" maxlength="40">

      <label for="campoMensaje">Tu mensaje</label>
      <textarea id="campoMensaje" rows="3" maxlength="250" placeholder="Escribe lo que quieras decirle..."></textarea>

      <label for="campoDe">Tu nombre (firma)</label>
      <input type="text" id="campoDe" placeholder="Tu nombre" maxlength="40">

      <hr>

      <label for="campoSpotify">Canción de Spotify <span class="contador" id="contadorSpotify">0/3</span></label>
      <div class="fila">
        <input type="text" id="campoSpotify" placeholder="Pega aquí el enlace de la canción">
        <button type="button" id="botonAgregarSpotify">Agregar</button>
      </div>
      <p class="ayuda">En Spotify: ••• de la canción → Compartir → Copiar enlace de la canción.</p>

      <label for="campoArchivo">Música descargada <span class="contador" id="contadorLocal">0/3</span></label>
      <input type="file" id="campoArchivo" accept="audio/*" multiple>

      <p class="error" id="textoError"></p>

      <div class="fila botones">
        <button type="button" id="botonVista" class="secundario">Verla como ella</button>
        <button type="button" id="botonEnlace">Crear enlace para enviarle</button>
      </div>

      <div class="enlace" id="zonaEnlace" hidden>
        <input type="text" id="campoEnlace" readonly>
        <p class="ayuda" id="textoCopiado"></p>
      </div>
    </section>

  </main>

  <button type="button" id="botonVolver" class="volver" hidden>Volver a editar</button>

  <script src="cancion.js"></script>
</body>
</html>
